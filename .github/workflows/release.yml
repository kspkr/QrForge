name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm test
      - run: go test ./server/... ./apps/api/...

  npm:
    name: Publish npm packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not set; skipping npm publish."
            exit 0
          fi
          # Publish core first, then the packages that depend on it.
          for pkg in packages/core packages/react packages/sdk packages/cli; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping."
              continue
            fi
            (cd "$pkg" && npm publish --provenance --access public)
          done

  binaries:
    name: Build server binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist build
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="qrforge_${version}_${os}_${arch}"
              bin="qrforge"
              if [ "$os" = "windows" ]; then bin="qrforge.exe"; fi
              mkdir -p "build/$name"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -trimpath -ldflags "-s -w" -o "build/$name/$bin" ./apps/api
              cp LICENSE README.md "build/$name/" 2>/dev/null || true
              if [ "$os" = "windows" ]; then
                (cd build && zip -qr "../dist/$name.zip" "$name")
              else
                tar -C build -czf "dist/$name.tar.gz" "$name"
              fi
            done
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  github-release:
    name: GitHub release
    needs: [binaries, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "QRForge $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
