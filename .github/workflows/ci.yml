name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --workspaces --if-present
      - name: Test (core, react, cli, sdk, web)
        run: npm test
      - name: Build web app
        run: npm run build -w @qrforge/web
      - name: Build docs
        run: npm run build -w @qrforge/docs
      - name: Check npm packages
        run: |
          for pkg in packages/core packages/react packages/cli packages/sdk; do
            echo "::group::npm pack --dry-run $pkg"
            (cd "$pkg" && npm pack --dry-run)
            echo "::endgroup::"
          done

  go:
    name: Go (fmt, vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l server apps/api)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./server/... ./apps/api/...
      # Not ./... — that would descend into node_modules.
      - name: go test
        run: go test -race ./server/... ./apps/api/...
      - name: go build
        run: go build ./apps/api

  go-postgres:
    name: Go tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qrforge
          POSTGRES_PASSWORD: qrforge
          POSTGRES_DB: qrforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qrforge -d qrforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      QRFORGE_TEST_POSTGRES_URL: postgres://qrforge:qrforge@localhost:5432/qrforge_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # All packages share one database, so run them one at a time.
      - run: go test -p 1 ./server/...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
