name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web app (Studio / dashboard)
        - "@qrforge/core"
        - "@qrforge/react"
        - CLI (qrforge)
        - "@qrforge/sdk"
        - API / server
        - Docker / self-hosting
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case rather than only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      description: QRForge must stay free, private and self-hostable.
      options:
        - label: This works without paid services, external APIs or tracking.
          required: true
        - label: I'd be willing to help implement this.
