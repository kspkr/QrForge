name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please **don't** report security vulnerabilities here — see [SECURITY.md](https://github.com/kspkr/QrForge/blob/main/SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web app (Studio / dashboard)
        - "@qrforge/core"
        - "@qrforge/react"
        - CLI (qrforge)
        - "@qrforge/sdk"
        - API / server
        - Docker / self-hosting
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, code or commands that reproduce the problem.
      placeholder: |
        1. Run `qrforge generate https://example.com --style dots`
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: QRForge / package version, or commit SHA.
      placeholder: 0.1.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js / Go version, database (SQLite or PostgreSQL), Docker version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant output. Remove any secrets or personal data first.
      render: text
